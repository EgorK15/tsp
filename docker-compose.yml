services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: techqueue
      POSTGRES_PASSWORD: techqueue
      POSTGRES_DB: techqueue
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techqueue -d techqueue"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://techqueue:techqueue@db:5432/techqueue
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      ROOT_PATH: /api
      LOAD_SERVICE_TARGET: load-service:50051
      LOAD_SERVICE_TIMEOUT: ${LOAD_SERVICE_TIMEOUT:-2}
      RABBITMQ_URL: amqp://techqueue:techqueue@rabbitmq:5672/
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  load-service:
    build: .
    command: ["python", "-m", "load_service.server"]
    stop_signal: SIGINT
    environment:
      DATABASE_URL: postgresql+psycopg2://techqueue:techqueue@db:5432/techqueue
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    command: ["python", "-m", "scheduler.main"]
    environment:
      DATABASE_URL: postgresql+psycopg2://techqueue:techqueue@db:5432/techqueue
      LOAD_SERVICE_TARGET: load-service:50051
      LOAD_SERVICE_TIMEOUT: ${LOAD_SERVICE_TIMEOUT:-2}
      RABBITMQ_URL: amqp://techqueue:techqueue@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      load-service:
        condition: service_started

  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: techqueue
      RABBITMQ_DEFAULT_PASS: techqueue
    ports:
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  notification-service:
    build: .
    command: ["uvicorn", "notification_service.main:app", "--host", "0.0.0.0", "--port", "8001", "--log-level", "warning"]
    environment:
      RABBITMQ_URL: amqp://techqueue:techqueue@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:-change-me}
    depends_on:
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/static:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  pgdata:
  rabbitmqdata:
